[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/agenttraceback-adapter-sdk",
  "crates/agenttraceback-adapters",
  "crates/agenttraceback-api",
  "crates/agenttraceback-blobs",
  "crates/agenttraceback-cli",
  "crates/agenttraceback-config",
  "crates/agenttraceback-correlation",
  "crates/agenttraceback-crypto",
  "crates/agenttraceback-daemon",
  "crates/agenttraceback-events",
  "crates/agenttraceback-export",
  "crates/agenttraceback-platform",
  "crates/agenttraceback-projects",
  "crates/agenttraceback-recovery",
  "crates/agenttraceback-risk",
  "crates/agenttraceback-search",
  "crates/agenttraceback-snapshots",
  "crates/agenttraceback-store",
  "crates/agenttraceback-types",
  "fixtures/fixture-agent",
  "xtask",
]

[workspace.package]
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["AgentTraceback Contributors"]
homepage = "https://github.com/btsouth/agenttraceback"
repository = "https://github.com/btsouth/agenttraceback"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
agenttraceback-adapter-sdk = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-adapter-sdk" }
agenttraceback-adapters = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-adapters" }
agenttraceback-api = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-api" }
agenttraceback-blobs = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-blobs" }
agenttraceback-config = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-config" }
agenttraceback-correlation = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-correlation" }
agenttraceback-crypto = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-crypto" }
agenttraceback-daemon = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-daemon" }
agenttraceback-events = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-events" }
agenttraceback-export = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-export" }
agenttraceback-platform = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-platform" }
agenttraceback-projects = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-projects" }
agenttraceback-recovery = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-recovery" }
agenttraceback-risk = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-risk" }
agenttraceback-search = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-search" }
agenttraceback-snapshots = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-snapshots" }
agenttraceback-store = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-store" }
agenttraceback-types = { version = "0.1.0-alpha.4", path = "crates/agenttraceback-types" }
blake3 = "1.8"
bytes = "1.10"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
crossterm = "0.29"
fs2 = "0.4"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
hkdf = "0.12"
http = "1.3"
keyring = "4.2"
notify = "8.2"
parking_lot = "0.12"
portable-pty = "0.9"
rand = "0.9"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
similar = "2.7"
subtle = "2.6"
sysinfo = "0.38"
tauri = { version = "2.8", features = [] }
tauri-build = { version = "2.4", features = [] }
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
tower = "0.5"
terminal_size = "0.4"
tower-http = { version = "0.6", features = ["trace", "limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
uuid = { version = "1.18", features = ["serde", "v4", "v5", "v7"] }
walkdir = "2.5"
ed25519-dalek = "2.2"
zeroize = "1.8"
zstd = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
