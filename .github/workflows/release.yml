name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            bundles: deb,appimage
            target: x86_64-unknown-linux-gnu
          - name: macos-universal
            os: macos-15
            bundles: app,dmg
            target: universal-apple-darwin
          - name: windows-x86_64
            os: windows-2025
            bundles: nsis,msi
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build CLI and daemon sidecars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/src-tauri/binaries
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            cargo build --release -p agenttraceback-daemon -p agenttraceback-cli --target aarch64-apple-darwin
            cargo build --release -p agenttraceback-daemon -p agenttraceback-cli --target x86_64-apple-darwin
            for binary in agenttraceback agenttracebackd; do
              for architecture in aarch64-apple-darwin x86_64-apple-darwin; do
                cp "target/$architecture/release/$binary" \
                  "apps/desktop/src-tauri/binaries/$binary-$architecture"
              done
              lipo -create \
                "target/aarch64-apple-darwin/release/$binary" \
                "target/x86_64-apple-darwin/release/$binary" \
                -output "apps/desktop/src-tauri/binaries/$binary-universal-apple-darwin"
            done
          else
            cargo build --release -p agenttraceback-daemon -p agenttraceback-cli --target "${{ matrix.target }}"
            if [ "${{ runner.os }}" = "Windows" ]; then
              extension=".exe"
            else
              extension=""
            fi
            for binary in agenttraceback agenttracebackd; do
              cp "target/${{ matrix.target }}/release/$binary$extension" \
                "apps/desktop/src-tauri/binaries/$binary-${{ matrix.target }}$extension"
            done
          fi
      - name: Build installer and signed updater artifacts when keys are available
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sidecar_config='{"bundle":{"externalBin":["binaries/agenttracebackd","binaries/agenttraceback"]}}'
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_UPDATER_PUBLIC_KEY" ]; then
            sidecar_config="{\"bundle\":{\"externalBin\":[\"binaries/agenttracebackd\",\"binaries/agenttraceback\"],\"createUpdaterArtifacts\":true},\"plugins\":{\"updater\":{\"pubkey\":\"$TAURI_UPDATER_PUBLIC_KEY\",\"endpoints\":[\"https://github.com/btsouth/agenttraceback/releases/latest/download/latest.json\"]}}}"
          fi
          pnpm --filter @agenttraceback/desktop tauri build \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" \
            --config "$sidecar_config"
      - name: Generate shell completions
        shell: bash
        run: |
          mkdir -p "release-completions"
          for shell in bash zsh fish powershell; do
            cargo run --release -p agenttraceback-cli -- completions "$shell" > "release-completions/agenttraceback.$shell"
          done
      - name: Stage distributable assets and checksums
        shell: bash
        run: python3 scripts/stage-release.py "${{ matrix.target }}" "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release-staged/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease --notes-file docs/prerelease-notes.md)
          fi
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --generate-notes --title "AgentTraceback ${GITHUB_REF_NAME}" "${release_flags[@]}"
          find release-artifacts -maxdepth 1 -type f -print0 | xargs -0 gh release upload "${GITHUB_REF_NAME}" --clobber
