[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "Tauri's GTK macro stack transitively uses proc-macro-error; no upgrade is available." },
    { id = "RUSTSEC-2025-0075", reason = "Tauri's URL pattern parser transitively uses unmaintained unic crates; no safe upgrade is available." },
    { id = "RUSTSEC-2025-0080", reason = "Tauri's URL pattern parser transitively uses unmaintained unic crates; no safe upgrade is available." },
    { id = "RUSTSEC-2025-0081", reason = "Tauri's URL pattern parser transitively uses unmaintained unic crates; no safe upgrade is available." },
    { id = "RUSTSEC-2025-0098", reason = "Tauri's URL pattern parser transitively uses unmaintained unic crates; no safe upgrade is available." },
    { id = "RUSTSEC-2025-0100", reason = "Tauri's URL pattern parser transitively uses unmaintained unic crates; no safe upgrade is available." },
]

[licenses]
version = 2
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.93
# Tauri native clipboard support on Windows uses the permissive Boost license.
exceptions = [
    { name = "clipboard-win", allow = ["BSL-1.0"] },
    { name = "error-code", allow = ["BSL-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
